# Prometheus scrape configuration for KAURAX.
#
# Every series comes from live component state. There are no recording rules that
# synthesise a value: a gap in a graph means "not measured", not "zero".
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    network: kaurax
    layer: "3"

rule_files:
  - /etc/prometheus/alerts.yml

# Where firing alerts are sent. Without this block Prometheus evaluates every rule in
# alerts.yml and delivers the result nowhere — it shows up in Prometheus's own UI and stops
# there, which looks like alerting and is not.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The compose service is `kaurax-l3`; there is no service called `kaurax-node`. Prometheus
  # resolves targets through Docker's DNS, so the old name never resolved and this job had
  # been down for as long as it has existed — silently, because a scrape target that cannot
  # be resolved is just a target that is down, and nothing was watching for that either.
  - job_name: kaurax-node
    static_configs:
      - targets: ["kaurax-l3:7300"]
        labels:
          component: kaurax-node
    metrics_path: /metrics

  - job_name: kaurax-indexer
    static_configs:
      - targets: ["indexer:7301"]
        labels:
          component: kaurax-indexer
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Scraped so that `up == 0` covers it, which is what KauraxScrapeTargetDown alerts on.
  # Note the limit of that: if Alertmanager is the thing that is down, Prometheus has
  # nowhere to send the alert saying so. Only an external dead-man's switch closes that
  # gap — see docs/MONITORING.md.
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          component: alertmanager
