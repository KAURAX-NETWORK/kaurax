# KAURAX reverse proxy.
#
# Everything the internet can reach passes through here. The services behind it bind only
# to the internal Docker network.

user  nginx;
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Do not advertise the exact nginx version to the internet.
    server_tokens off;

    log_format kaurax '$remote_addr - $host "$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" rt=$request_time '
                      'upstream=$upstream_addr ut=$upstream_response_time';
    access_log /var/log/nginx/access.log kaurax;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    client_max_body_size 2m;

    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 1024;

    # ------------------------------------------------------- rate limits --
    # An unauthenticated public RPC is a free compute endpoint for anyone who finds it.
    # These are per-IP ceilings, not a substitute for an API gateway.
    limit_req_zone $binary_remote_addr zone=rpc:10m  rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # --------------------------------------------------------- upstreams --
    upstream kaurax_rpc     { server kaurax-l3:8420;  keepalive 32; }
    upstream kaurax_ws      { server kaurax-l3:8421;  keepalive 32; }
    upstream kaurax_api     { server kaurax-api:4000; keepalive 32; }
    upstream kaurax_indexer { server kaurax-indexer:7301; keepalive 8; }

    # Map for WebSocket upgrade passthrough.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
