name: ci

on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.28.0}
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: pnpm}
      # The doc-count gate below runs `forge test` to learn the real number, so this job
      # needs Foundry as well as node.
      - uses: foundry-rs/foundry-toolchain@v1
        with: {version: stable}

      - run: pnpm install --frozen-lockfile=false
      - run: cd blockchain/contracts && forge install foundry-rs/forge-std --no-git

      # turbo builds dependencies first, so packages see each other's declarations.
      - name: Typecheck
        run: pnpm typecheck

      # Documented test counts have drifted four separate times, each caught by hand. This
      # is the gate that stops it: docs/TEST_STATUS.md must equal what the suites report, and
      # no document may contradict them.
      - name: Documented test counts match the suites
        run: ./tests/check-doc-counts.sh

      - name: Unit tests
        run: pnpm test

      - name: Build all packages and apps
        run: pnpm build

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: blockchain/contracts}
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with: {version: stable}
      - run: forge install foundry-rs/forge-std --no-git
      - run: forge build --sizes
      - run: forge fmt --check
      - run: forge test -vv

  integration:
    name: devnet end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kaurax
          POSTGRES_PASSWORD: kaurax_ci
          POSTGRES_DB: kaurax
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kaurax"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with: {version: stable}
      - uses: pnpm/action-setup@v4
        with: {version: 10.28.0}
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: pnpm}
      - run: pnpm install --frozen-lockfile=false

      # Brings up L1, L2, settlement contracts, KAURAX genesis and kaurax-node.
      # start.sh runs `forge build`, which needs forge-std. It is not vendored, so without
      # this the devnet job failed at compilation before it ever reached the chain.
      - name: Install forge-std
        run: cd blockchain/contracts && forge install foundry-rs/forge-std --no-git

      - name: Start the KAURAX devnet
        run: ./infra/scripts/devnet/start.sh

      - name: End-to-end acceptance test
        run: ./tests/acceptance.sh

      # Hostile input at the protocol edge. These need a running chain, so they cannot live in
      # the default `pnpm test` — a fresh clone must be able to run its tests without one.
      # Examples are read constantly and run almost never, which is how they rot.
      - name: Examples still work
        run: ./tests/examples-smoke.sh

      - name: Security and adversarial suites
        run: pnpm --filter @kaurax/tests test:integration
        env:
          KAURAX_RPC_URL: http://127.0.0.1:8420

      # The indexer and API are verified against the same live chain the acceptance test
      # just exercised, so this covers the real data path rather than a fixture.
      - name: Start the indexer and API
        env:
          DATABASE_URL: postgresql://kaurax:kaurax_ci@127.0.0.1:5432/kaurax
        run: |
          set -a; . ./.env; set +a
          export DATABASE_URL=postgresql://kaurax:kaurax_ci@127.0.0.1:5432/kaurax
          # turbo, not `pnpm --filter`: the filter builds only the named package, so
          # @kaurax/types stayed unbuilt and tsc could not resolve its declarations.
          # turbo.json declares dependsOn: ["^build"], so this builds dependencies first.
          pnpm turbo run build --filter=@kaurax/indexer --filter=@kaurax/api
          node services/indexer/dist/index.js > /tmp/indexer.log 2>&1 &
          sleep 8
          node services/api/dist/index.js > /tmp/api.log 2>&1 &
          sleep 8

      - name: Verify the API against live chain data
        run: ./tests/api-smoke.sh

      # Exercises Names, Swap and Launchpad through the same ABIs the frontends use.
      - name: Verify the application contracts
        run: ./tests/apps-smoke.sh

      - name: Logs on failure
        if: failure()
        run: |
          echo "--- kaurax-node ---"; tail -100 .devnet/kaurax-node.log || true
          echo "--- indexer ---";     tail -60  /tmp/indexer.log        || true
          echo "--- api ---";         tail -60  /tmp/api.log            || true

      # A CI runner is always a clean machine, so the first start.sh always worked and the
      # *second* one on any developer's laptop did not: start.sh creates fresh anvil chains
      # but used to leave the previous chain's derivation cursor and sequencer WAL behind,
      # and the node correctly refused to derive against a chain that no longer existed.
      # Restarting here is the only way CI can see what every returning developer saw.
      - name: The devnet must be restartable, not just startable
        run: |
          ./infra/scripts/devnet/stop.sh
          ./infra/scripts/devnet/start.sh
          ./infra/scripts/devnet/status.sh

      - name: Stop the devnet
        if: always()
        run: ./infra/scripts/devnet/stop.sh

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with: {version: stable}
      - uses: pnpm/action-setup@v4
        with: {version: 10.28.0}
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: pnpm}
      - run: pnpm install --frozen-lockfile=false

      # Contract coverage is the number that matters most: these are the lines that hold
      # user funds. Reported, and gated on the settlement and governance contracts, which
      # are the ones an attacker reaches.
      - name: Contract coverage
        working-directory: blockchain/contracts
        run: |
          forge install foundry-rs/forge-std --no-git
          forge coverage --report summary --report lcov | tee coverage.txt

      - name: Enforce coverage on security-critical contracts
        working-directory: blockchain/contracts
        run: |
          # Parses forge's summary table. A contract in this list must stay above 80% lines.
          FAILED=0
          for FILE in KauraxPortal KauraxL2OutputOracle KauraxMultisig KauraxTimelock MerkleTree; do
            LINE=$(grep -E "^\| src/.*${FILE}\.sol" coverage.txt || true)
            if [ -z "$LINE" ]; then
              echo "::warning::no coverage row found for ${FILE}.sol"
              continue
            fi
            PCT=$(echo "$LINE" | awk -F'|' '{print $3}' | grep -oE '[0-9]+\.[0-9]+' | head -1)
            echo "${FILE}: ${PCT}% lines"
            awk -v p="$PCT" 'BEGIN{exit !(p+0 < 80)}' && {
              echo "::error::${FILE}.sol line coverage ${PCT}% is below the 80% floor"
              FAILED=1
            }
          done
          exit $FAILED

      # vitest is invoked directly rather than through turbo, so nothing builds the
      # workspace packages the tests import — test/signer.test.ts could not resolve
      # @kaurax/signer because its dist/ did not exist.
      - name: Build workspace packages the tests import
        run: pnpm --filter "@kaurax/l3^..." build

      - name: Node unit-test coverage
        # `|| true` used to hide that @vitest/coverage-v8 was not installed at all, so this
        # step printed nothing and passed for as long as it has existed. The dependency is
        # now present and the command must succeed. There is deliberately no percentage
        # gate: node unit coverage is 12% and gating at a number the repository does not meet
        # would mean either a failing pipeline or a threshold set low enough to be
        # meaningless. docs/TESTING_REPORT.md says what is actually covered and by what.
        run: pnpm --filter @kaurax/l3 exec vitest run --coverage.enabled --coverage.reporter=text

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            blockchain/contracts/coverage.txt
            blockchain/contracts/lcov.info
          retention-days: 14
