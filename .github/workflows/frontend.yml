name: frontend

on:
  push:
    branches: [main]
    paths: ["apps/**", "packages/ui/**", "packages/types/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["apps/**", "packages/ui/**", "packages/types/**", ".github/workflows/frontend.yml"]
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, explorer, wallet, bridge, pay, ai, swap, names, launchpad, docs]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.28.0}
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: pnpm}

      - run: pnpm install --frozen-lockfile=false

      # `pnpm --filter` runs the package script directly and bypasses turbo, so the
      # workspace packages an app imports — @kaurax/types, @kaurax/ui — were never built and
      # tsc could not find their declarations. turbo.json already declares that typecheck and
      # build depend on ^build; going through turbo is what makes that declaration apply.
      - name: Typecheck
        run: pnpm turbo run typecheck --filter="./apps/${{ matrix.app }}"

      - name: Build
        run: pnpm turbo run build --filter="./apps/${{ matrix.app }}"
        env:
          # Build-time values only. No secret is ever a NEXT_PUBLIC_ variable — the AI key
          # and the database URL live on the API server, never in a frontend bundle.
          NEXT_PUBLIC_KAURAX_RPC_URL: ${{ vars.NEXT_PUBLIC_KAURAX_RPC_URL || 'http://127.0.0.1:8420' }}
          NEXT_PUBLIC_KAURAX_WS_URL: ${{ vars.NEXT_PUBLIC_KAURAX_WS_URL || 'ws://127.0.0.1:8421' }}
          NEXT_PUBLIC_KAURAX_CHAIN_ID: ${{ vars.NEXT_PUBLIC_KAURAX_CHAIN_ID || '8420' }}
          NEXT_PUBLIC_KAURAX_API_URL: ${{ vars.NEXT_PUBLIC_KAURAX_API_URL || 'http://127.0.0.1:4000' }}
          NEXT_PUBLIC_KAURAX_EXPLORER_URL: ${{ vars.NEXT_PUBLIC_KAURAX_EXPLORER_URL || 'http://127.0.0.1:3000' }}
          NEXT_PUBLIC_KAURAX_DOMAIN: ${{ vars.NEXT_PUBLIC_KAURAX_DOMAIN }}

      # Grepping source for secret *names* is not enough — a name can legitimately appear
      # in help text. This checks the built output for anything shaped like a real key.
      # Any 32-byte hex used to fail this. That is unusable: every crypto library bundles
      # curve constants — secp256k1's field prime and group order, BLS12-381 parameters,
      # ERC-6492's magic bytes — and contract bytecode is a long hex string too. This step
      # matched all of them, so it could only ever have passed on an app that shipped no
      # cryptography.
      #
      # What actually distinguishes a leaked key is not its shape but what it is bound to.
      # Minification keeps property names, so `privateKey:"0x…"` survives into the bundle.
      # This is the same test the source scanner applies, pointed at the built output.
      - name: Scan the built bundle for keys bound to key-like names
        run: |
          DIR="apps/${{ matrix.app }}/.next/static/"
          PATTERN='(private[_-]?key|secret|mnemonic|seed[_-]?phrase|signer[_-]?key|deployer[_-]?key)["'"'"']?[[:space:]]*[:=][[:space:]]*["'"'"']?0x[0-9a-fA-F]{64}'
          if grep -rqEi "$PATTERN" "$DIR" 2>/dev/null; then
            echo "::error::A key-shaped literal bound to a key-like name is in the ${{ matrix.app }} client bundle."
            grep -rlEi "$PATTERN" "$DIR" | head -5
            exit 1
          fi
          echo "no key-shaped literals bound to key-like names in the ${{ matrix.app }} client bundle"

  # Guards the rule that matters most for the frontends: a secret must never be bundled.
  secret-leak-check:
    name: no secrets in frontend bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject server-only variables in app source
        run: |
          # These belong to the API server. Referencing them from an app would ship them.
          if grep -rnE 'process\.env\.(XKIRO_API_KEY|DATABASE_URL|.*PRIVATE_KEY|POSTGRES_PASSWORD)' apps/ ; then
            echo "::error::A server-only environment variable is referenced from a frontend app."
            echo "Secrets must stay in services/api. Frontends may only use NEXT_PUBLIC_* values."
            exit 1
          fi
          echo "no server-only variables referenced from apps/"

      - name: Reject secrets smuggled into NEXT_PUBLIC_ variables
        run: |
          if grep -rnE 'NEXT_PUBLIC_[A-Z_]*(KEY|SECRET|TOKEN|PASSWORD|PRIVATE)' apps/ packages/ .env.example ; then
            echo "::error::A NEXT_PUBLIC_ variable looks like it carries a secret. Everything NEXT_PUBLIC_ is shipped to browsers."
            exit 1
          fi
          echo "no secret-shaped NEXT_PUBLIC_ variables"
