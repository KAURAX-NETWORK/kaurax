name: contracts

on:
  push:
    branches: [main]
    paths: ["blockchain/contracts/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["blockchain/contracts/**", ".github/workflows/contracts.yml"]
  workflow_dispatch:

jobs:
  forge:
    name: build, test, fmt
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: blockchain/contracts}
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with: {version: stable}

      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-git

      - run: forge build --sizes
      - run: forge fmt --check
      - run: forge test -vv

      # Fuzzing matters most for the withdrawal Merkle tree: a divergence between the
      # incremental on-chain root and a full rebuild would break every withdrawal proof.
      - name: Fuzz the withdrawal tree harder
        run: forge test --match-path test/MerkleTree.t.sol --fuzz-runs 20000

      - run: forge coverage --report summary || true
