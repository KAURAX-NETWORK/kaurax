name: security

on:
  push: {branches: [main]}
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  secrets:
    name: no committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      # A hard gate, not advisory. This repository is public: a committed credential is
      # not a warning to read later, it is a key to rotate now. fetch-depth 0 above means
      # the whole history is scanned, not only the diff — a secret removed in a later
      # commit is still a secret anyone can check out.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A committed .env is the failure mode that actually happens. Fail hard on it.
      - name: Reject committed environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::An environment file is tracked in git. Remove it and rotate every key it contained."
            exit 1
          fi
          echo "no tracked .env files"

      # Matching raw 32-byte hex is the wrong test: an ERC-20 topic0, a Merkle root and a
      # transaction hash are all 64 hex characters and none is a secret. What makes a
      # literal suspicious is the name it is bound to. This checks context instead, so it
      # flags PRIVATE_KEY="0x…" and ignores ERC20_TRANSFER_TOPIC="0x…".
      #
      # Two trees legitimately hold the published Anvil keys and are excluded by path:
      # infra/scripts/devnet/, which injects them into a local .env, and the test trees.
      - name: Scan for private keys in source
        run: |
          python3 - <<'EOF'
          import re, subprocess, sys

          SKIP = re.compile(r'(^|/)(tests?|node_modules|out|dist|\.next|lib)/|infra/scripts/devnet/')
          KEYISH = re.compile(
              r'(private[_-]?key|secret|mnemonic|seed|signer[_-]?key|deployer[_-]?key)\s*[:=]\s*["\x27]?0x[0-9a-fA-F]{64}',
              re.I)

          files = subprocess.run(["git", "ls-files"], capture_output=True, text=True).stdout.split()
          hits = []
          for f in files:
              if SKIP.search(f) or not f.endswith((".ts", ".tsx", ".js", ".mjs", ".sol", ".sh", ".yml", ".yaml", ".json", ".env.example")):
                  continue
              try:
                  text = open(f, encoding="utf-8", errors="ignore").read()
              except OSError:
                  continue
              for m in KEYISH.finditer(text):
                  line = text[:m.start()].count("\n") + 1
                  hits.append(f"{f}:{line}")

          if hits:
              for h in hits:
                  print(f"::error file={h.split(':')[0]},line={h.split(':')[1]}::key-shaped literal bound to a key-like name")
              sys.exit(1)
          print("no key-shaped literals bound to key-like names outside tests and the devnet script")
          EOF

  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.28.0}
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: pnpm}
      - run: pnpm install --frozen-lockfile=false
      # Advisory: advisories land in transitive dependencies daily and are outside this
      # repository's control. A critical advisory is still a hard stop below.
      - run: pnpm audit --audit-level high
        continue-on-error: true
      - name: Fail on critical advisories
        run: pnpm audit --audit-level critical

  slither:
    name: slither static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with: {version: stable}
      - run: cd blockchain/contracts && forge install foundry-rs/forge-std --no-git && forge build
      # A hard gate. This analyses code we wrote and control, so a high-severity finding
      # is a reason to stop, not a notification. Suppress a specific false positive with a
      # slither-disable-next-line comment and a justification, never by weakening the gate.
      - uses: crytic/slither-action@v0.4.0
        with:
          target: blockchain/contracts/
          slither-args: --exclude-dependencies --exclude naming-convention
          fail-on: high
