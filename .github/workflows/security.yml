name: security

on:
  push: {branches: [main]}
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  secrets:
    name: no committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      # A hard gate, not advisory. This repository is public: a committed credential is
      # not a warning to read later, it is a key to rotate now. fetch-depth 0 above means
      # the whole history is scanned, not only the diff — a secret removed in a later
      # commit is still a secret anyone can check out.
      #
      # The official action refuses to run for an organization without a paid licence:
      #   "[KAURAX-NETWORK] is an organization. License key is required."
      # So from the moment this repository moved into the org, its headline secret gate
      # stopped scanning anything and simply failed — which is the worst of both, since a
      # red step nobody can make green is a step people stop reading.
      #
      # gitleaks itself is Apache-2.0. Running the binary keeps the gate real and free.
      - name: gitleaks
        run: |
          VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks --version
          # --redact so a finding never prints the secret into a public build log.
          gitleaks detect --source . --no-banner --redact --exit-code 1

      # A committed .env is the failure mode that actually happens. Fail hard on it.
      - name: Reject committed environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::An environment file is tracked in git. Remove it and rotate every key it contained."
            exit 1
          fi
          echo "no tracked .env files"

      # Matching raw 32-byte hex is the wrong test: an ERC-20 topic0, a Merkle root and a
      # transaction hash are all 64 hex characters and none is a secret. What makes a
      # literal suspicious is the name it is bound to. This checks context instead, so it
      # flags PRIVATE_KEY="0x…" and ignores ERC20_TRANSFER_TOPIC="0x…".
      #
      # Two trees legitimately hold the published Anvil keys and are excluded by path:
      # infra/scripts/devnet/, which injects them into a local .env, and the test trees.
      - name: Scan for private keys in source
        run: |
          python3 - <<'EOF'
          import re, subprocess, sys

          SKIP = re.compile(r'(^|/)(tests?|node_modules|out|dist|\.next|lib)/|infra/scripts/devnet/')
          # `[:=]` alone missed the shape a fallback takes:
          #     const KEY = process.env.PRIVATE_KEY ?? "0x…64 hex…"
          # which is exactly how a default gets written, and exactly how a real key would slip
          # past this gate. `??` and `||` are now matched too.
          # Two shapes were missing, and both are how a default actually gets written:
          #
          #     const PRIVATE_KEY = process.env.PK ?? "0x…64 hex…"
          #     let deployerKey = opts.key || "0x…64 hex…"
          #
          # Requiring the name to sit immediately beside the literal missed every one of
          # them. The literal may now follow after an intervening expression, as long as it
          # is on the same statement — no newline, no semicolon, and no other string in
          # between, which keeps this from matching unrelated hex further down a file.
          KEYISH = re.compile(
              r'(private[_-]?key|secret|mnemonic|seed|signer[_-]?key|deployer[_-]?key)'
              r'["\x27]?\s*(?::|=)\s*'   # optional closing quote: "mnemonic": "0x…"
              r'[^;\n"\x27]{0,120}'
              r'["\x27]?(0x[0-9a-fA-F]{64})',
              re.I)

          # Anvil's published development keys. They ship inside every Foundry install, fund
          # the local devnet, and are worth nothing. Allow them by exact value rather than by
          # excluding the directories they appear in — excluding a path would also hide a real
          # key that happened to be written there.
          PUBLIC_DEV_KEYS = {
              "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80",
              "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d",
              "0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a",
              "0x7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6",
              "0x47e179ec197488593b187f80a00eb0da91f1b9d0b13f8733639f19c30a34926a",
          }
          HEX = re.compile(r'0x[0-9a-fA-F]{64}')

          files = subprocess.run(["git", "ls-files"], capture_output=True, text=True).stdout.split()
          hits = []
          for f in files:
              if SKIP.search(f) or not f.endswith((".ts", ".tsx", ".js", ".mjs", ".sol", ".sh", ".yml", ".yaml", ".json", ".env.example")):
                  continue
              try:
                  text = open(f, encoding="utf-8", errors="ignore").read()
              except OSError:
                  continue
              for m in KEYISH.finditer(text):
                  found = HEX.search(m.group(0))
                  if found and found.group(0).lower() in PUBLIC_DEV_KEYS:
                      continue
                  line = text[:m.start()].count("\n") + 1
                  hits.append(f"{f}:{line}")

          if hits:
              for h in hits:
                  print(f"::error file={h.split(':')[0]},line={h.split(':')[1]}::key-shaped literal bound to a key-like name")
              sys.exit(1)
          print("no key-shaped literals bound to key-like names outside tests and the devnet script")
          EOF

  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.28.0}
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: pnpm}
      - run: pnpm install --frozen-lockfile=false
      # Advisory: advisories land in transitive dependencies daily and are outside this
      # repository's control. A critical advisory is still a hard stop below.
      - run: pnpm audit --audit-level high
        continue-on-error: true
      - name: Fail on critical advisories
        run: pnpm audit --audit-level critical

  slither:
    name: slither static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with: {version: stable}
      - run: cd blockchain/contracts && forge install foundry-rs/forge-std --no-git && forge build
      # A hard gate. This analyses code we wrote and control, so a high-severity finding
      # is a reason to stop, not a notification. Suppress a specific false positive with a
      # slither-disable-next-line comment and a justification, never by weakening the gate.
      - uses: crytic/slither-action@v0.4.0
        with:
          target: blockchain/contracts/
          slither-args: --exclude-dependencies --exclude naming-convention
          fail-on: high
