name: docker

on:
  push:
    branches: [main]
    paths: ["infra/docker/**", "docker-compose.yml", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["infra/docker/**", "docker-compose.yml", ".github/workflows/docker.yml"]
  workflow_dispatch:

jobs:
  build:
    name: build images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # These are the images docker-compose.yml actually builds. The matrix used to name
        # `node` and `explorer` at infra/docker/Dockerfile.<name>, a flat layout that has not
        # existed since the infra restructure — so both builds failed on every run. Nobody
        # noticed because this workflow only fires on changes under infra/docker or to
        # docker-compose.yml, and neither had been touched since.
        image: [bootstrap, l3, indexer, api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.image }}/Dockerfile
          push: false
          tags: kaurax-${{ matrix.image }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose:
    name: validate compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet && echo "docker-compose.yml is valid"
