name: docker

on:
  push:
    branches: [main]
    paths: ["infra/docker/**", "docker-compose.yml", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["infra/docker/**", "docker-compose.yml", ".github/workflows/docker.yml"]
  workflow_dispatch:

jobs:
  build:
    name: build images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [node, explorer]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.image }}
          push: false
          tags: kaurax-${{ matrix.image }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose:
    name: validate compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet && echo "docker-compose.yml is valid"
